<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Receipt Generator</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

</head>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 40px 20px;
        min-height: 100vh;

        font-family: Arial, sans-serif;

        background: #F7F1E8;
        color: #ba94dd;
    }

    .shop-card {
        width: 100%;
        max-width: 900px;
        margin: 0 auto;

        background: #FFFDF8;
        border: 1px solid #b389d5;
        border-radius: 22px;

        padding: 35px 45px;

        box-shadow:
            0 15px 40px rgba(134, 80, 170, 0.247);
    }

    .shop-card h1 {
        margin: 0 0 8px;

        color: #6e3a93;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.5px;
    }

    .shop-card h3 {
        color: #b47dce;
        margin-top: 28px;
        margin-bottom: 18px;
    }

    form {
        margin-top: 10px;
    }

    form label {
        display: block;

        margin: 10px 0;
        padding: 14px 16px;

        background: #caace4;
        border: 1px solid #E4D6C5;
        border-radius: 12px;

        color: #26190a;
        font-size: 16px;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    form label:hover {
        background: #F8EBDD;
        border-color: #ffda84;

        transform: translateX(3px);
    }

    form input[type="checkbox"] {
        width: 17px;
        height: 17px;

        margin-right: 10px;

        accent-color: #f7de8f;
        cursor: pointer;
    }

    form input[type="button"] {
        width: 100%;

        margin-top: 18px;
        padding: 14px 20px;

        border: none;
        border-radius: 12px;

        background: #f0d584;
        color: white;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    form input[type="button"]:hover {
        background: #ffdc83;

        transform: translateY(-2px);

        box-shadow:
            0 6px 15px rgba(59, 36, 24, 0.18);
    }

    form input[type="button"]:active {
        transform: translateY(0);
    }

    hr {
        border: none;
        border-top: 1px solid #E4D6C5;

        margin: 30px 0;
    }

    /* Receipt heading */
    .shop-card h3:nth-of-type(2) {
        text-align: center;

        padding: 15px;

        background: #ffdc83;
        color: #FFFDF8;

        border-radius: 10px;

        letter-spacing: 3px;
    }

    #receipt {
        min-height: 100px;

        padding: 20px;

        background: #F7F1E8;

        border: 1px dashed #C9B7A3;
        border-radius: 12px;

        font-size: 18px;
        line-height: 1.8;

        color: #271f03;
    }

    #receipt div,
    #receipt p {
        margin: 5px 0;
    }

    #receipt::before {
        content: "DEJA BREW COFFEE SHOP";
        display: block;

        text-align: center;

        margin-bottom: 12px;

        color: #8A7565;
        font-size: 12px;
        font-weight: bold;
        letter-spacing: 2px;
        }

    body {
            padding: 20px 12px;
        }

    .shop-card {
            padding: 25px 20px;
            border-radius: 16px;
        }

    .shop-card h1 {
            font-size: 25px;
        }

    form label {
            font-size: 15px;
            padding: 13px;
        }

    #receipt {
            font-size: 16px;
        }

</style>

<body>
    <div class="shop-card">
    <h1>OBMC Entrep Fair Group 1 - Deja Brew Coffee Shop</h1>

    <h3>Menu:</h3>

    <form>
    <label><input type="checkbox" id="americano"> Americano (₱ 155.00)</label><br>
    <label><input type="checkbox" id="latte"> Spanish Latte (₱ 165.50)</label><br>
    <label><input type="checkbox" id="coldbrew"> Cold Brew Malt (₱ 165.00)</label><br>
    <label><input type="checkbox" id="affogato"> Affogato (₱ 155.00)</label><br>
    <label><input type="checkbox" id="caramel"> Caramel Macchiato (₱ 185.00)</label><br>
    <label><input type="checkbox" id="cookie"> Cookie Butter Frappe (₱ 210.00)</label><br>
    <label><input type="checkbox" id="matcha"> Matcha Latte (₱ 185.50)</label><br><br>

    <input type="button" py-click="create_order" value="Create Order">
    </form>

    <br><hr>
    <h3>======== RECEIPT =========</h3>
    <div id="receipt" style="font-size: 18px;"></div>
    </div>

    <py-script src="main.py"></py-script>
</body>
</html>
